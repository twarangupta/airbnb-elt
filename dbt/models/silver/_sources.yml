version: 2

sources:
  - name: raw
    description: >
      Bronze layer: Inside Airbnb London files loaded unchanged by COPY INTO
      (ingestion/load_raw.py). Every source column is text. Append-only: each
      snapshot adds rows, tagged with _snapshot_date.
    database: AIRBNB
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      # Inside Airbnb publishes quarterly, so "fresh" means loaded within a quarter.
      freshness:
        warn_after: {count: 100, period: day}
        error_after: {count: 200, period: day}
    tables:
      - name: listings
        description: One row per listing per snapshot (90 source columns as text).
      - name: calendar
        description: One row per listing per date per snapshot (365 or 366 future days). No price column.
      - name: reviews
        description: >
          One row per review per snapshot. Each snapshot repeats every past
          review of the listings it contains.
