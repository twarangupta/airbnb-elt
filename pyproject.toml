# Settings for Python tools (not a package). ruff = linter, pytest = tests.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
